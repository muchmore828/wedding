<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子結婚書約 - 線上簽名與祝福</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #d4a373;
      --primary-dark: #bc8a5f;
      --bg-color: #fefae0;
      --card-bg: #ffffff;
      --text-color: #4a3f35;
      --accent-color: #e76f51;
      --danger-color: #e63946;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Zen Maru Gothic", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    .header-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .header-title h1 {
      font-size: 1.8rem;
      color: var(--primary-dark);
      letter-spacing: 2px;
      font-family: "Kiwi Maru", serif;
      font-weight: 500;
    }

    .header-title p {
      font-size: 0.95rem;
      color: #8d7b68;
      margin-top: 5px;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 1100px;
    }

    @media (min-width: 900px) {
      .app-container {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    /* 結婚書約顯示區域 */
    .certificate-wrapper {
      flex: 1;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 15px;
      position: relative;
      border: 1px solid #faedcd;
    }

    .certificate-card {
      position: relative;
      width: 100%;
      min-height: 500px;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 8px;
      overflow: hidden;
      margin: 0 auto;
    }

    /* Canvas 全圖覆蓋繪圖層 */
    .canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 工具面板 */
    .tools-panel {
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
      z-index: 100;
    }

    @media (min-width: 900px) {
      .tools-panel {
        width: 340px;
      }
    }

    /* 右側頁籤切換按鈕區 */
    .tab-container {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      font-size: 0.95rem;
      font-weight: bold;
      border: 2px solid var(--primary-color);
      background: #fff;
      color: var(--primary-dark);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-family: inherit;
    }

    .tab-btn.active {
      background: var(--primary-dark);
      color: #fff;
      border-color: var(--primary-dark);
    }

    .tool-group-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--primary-dark);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 12px;
      border: 1px solid var(--primary-color);
      background: #fff;
      color: var(--primary-dark);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
    }

    .btn:hover { background: var(--primary-color); color: #fff; }
    .btn.active { background: var(--primary-dark); color: #fff; border-color: var(--primary-dark); }
    .btn-action { background: var(--primary-color); color: white; border: none; font-weight: bold; }
    
    .btn-danger {
      background: #fff;
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
    }
    .btn-danger:hover {
      background: var(--danger-color);
      color: #fff;
    }

    .btn-export {
      background: var(--accent-color);
      color: white;
      border: none;
      font-size: 1rem;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(231, 111, 81, 0.3);
      font-family: inherit;
    }

    .admin-box {
      background: #fff0f0;
      border: 1px dashed var(--danger-color);
      padding: 10px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .admin-toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #b71c1c;
      cursor: pointer;
    }

    .color-options { display: flex; gap: 8px; }
    .color-dot {
      width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
      border: 2px solid #fff; box-shadow: 0 0 0 1px #ccc;
      transition: transform 0.2s;
    }
    .color-dot.active { transform: scale(1.2); box-shadow: 0 0 0 2px var(--primary-dark); }

    .sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .sticker-btn {
      font-size: 1.5rem; padding: 6px; background: #fefae0;
      border: 1px solid #e9edc9; border-radius: 6px; cursor: pointer; text-align: center;
    }

    .text-input-group { display: flex; gap: 6px; }
    .text-input-group input {
      flex: 1; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px;
      font-size: 0.9rem; font-family: "Zen Maru Gothic", sans-serif;
    }

    .draggable-item {
      position: absolute; cursor: move; user-select: none; padding: 4px 8px;
      border-radius: 4px; display: flex; align-items: center; gap: 4px; font-size: 1.2rem; z-index: 50;
      font-family: "Zen Maru Gothic", sans-serif;
    }
    .draggable-item:hover { border: 1px dashed #d4a373; background: rgba(255, 255, 255, 0.8); }
    .draggable-item .delete-btn { display: none; color: red; font-weight: bold; cursor: pointer; margin-left: 4px; }
    .draggable-item:hover .delete-btn { display: inline; }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="header-title">
    <h1>電子結婚書約 - 線上簽名與祝福</h1>
    <p>切換右側頁籤選擇款式，親友即可親筆簽名與留下祝福！</p>
  </div>

  <div class="app-container">
    
    <!-- 結婚書約圖片與繪圖區 -->
    <div class="certificate-wrapper" id="certificateNode">
      <div class="certificate-card" id="certCard">
        <div class="canvas-container" id="canvasContainer">
          <canvas id="drawingCanvas"></canvas>
        </div>
      </div>
    </div>

    <!-- 右側控制工具面板 -->
    <div class="tools-panel">
      
      <!-- 管理者模式開關與專用重置工具 -->
      <div class="admin-box">
        <label class="admin-toggle-label">
          <input type="checkbox" id="adminToggle" onchange="toggleAdminMode(this.checked)">
          🔐 開啟管理者權限
        </label>
        <div id="adminControls" style="display: none; margin-top: 8px;" class="btn-row">
          <button type="button" class="btn btn-danger" style="width: 100%; justify-content: center;" onclick="adminResetCurrentStyle()">
            💣 徹底清空此款式所有筆跡與貼圖
          </button>
        </div>
      </div>

      <!-- 右側頁籤切換 -->
      <div>
        <div class="tool-group-title">選擇結婚書約款式</div>
        <div class="tab-container">
          <button type="button" class="tab-btn active" id="tab1" onclick="switchTab(1)">📜 書約款式 A</button>
          <button type="button" class="tab-btn" id="tab2" onclick="switchTab(2)">🎨 書約款式 B</button>
        </div>
      </div>

      <!-- 筆刷與模式控制區 -->
      <div>
        <div class="tool-group-title">
          <span>筆刷與工具</span>
          <span id="currentToolText" style="font-size:0.8rem; color:#8d7b68;">【鋼筆筆刷】</span>
        </div>
        <div class="btn-row">
          <button type="button" class="btn active" id="penBtn" onclick="setMode('pen')">✒️ 畫筆</button>
          <button type="button" class="btn btn-danger" id="eraserBtn" style="display: none;" onclick="setMode('eraser')">🧹 橡皮擦 (管理者)</button>
        </div>
        <div class="btn-row" style="margin-top: 8px;">
          <button type="button" class="btn" onclick="undoMyStroke()">↩️ 復原我剛剛的筆劃</button>
          <button type="button" class="btn" onclick="clearMySessionStrokes()">🗑️ 清除我本次簽劃</button>
        </div>
      </div>

      <!-- 墨色與大小調整 -->
      <div>
        <div class="tool-group-title" id="sizeLabelTitle">墨水顏色與筆觸粗細</div>
        <div style="display: flex; justify-content: space-between; align-items: center;" id="colorRow">
          <div class="color-options">
            <div class="color-dot active" style="background:#2b2b2b;" title="墨黑" onclick="setColor('#2b2b2b', this)"></div>
            <div class="color-dot" style="background:#1d3557;" title="藍色" onclick="setColor('#1d3557', this)"></div>
            <div class="color-dot" style="background:#2a9d8f;" title="綠色" onclick="setColor('#2a9d8f', this)"></div>
            <div class="color-dot" style="background:#e76f51;" title="橘色" onclick="setColor('#e76f51', this)"></div>
            <div class="color-dot" style="background:#6a4c93;" title="紫色" onclick="setColor('#6a4c93', this)"></div>
          </div>
          <div class="slider-container">
            <input type="range" id="brushSize" min="2" max="15" value="4" oninput="setBrushSize(this.value)">
          </div>
        </div>
        <div id="eraserSizeContainer" style="display: none; margin-top: 6px;">
          <div class="slider-container" style="justify-content: space-between;">
            <span>橡皮擦大小：</span>
            <input type="range" id="eraserSize" min="10" max="60" value="25" oninput="setEraserSize(this.value)" style="width: 60%;">
          </div>
        </div>
      </div>

      <!-- 可愛貼圖 -->
      <div>
        <div class="tool-group-title">點擊添加貼圖（可拖曳）</div>
        <div class="sticker-grid">
          <button type="button" class="sticker-btn" onclick="addSticker('❤️')">❤️</button>
          <button type="button" class="sticker-btn" onclick="addSticker('💍')">💍</button>
          <button type="button" class="sticker-btn" onclick="addSticker('💐')">💐</button>
          <button type="button" class="sticker-btn" onclick="addSticker('🐱')">🐱</button>
          <button type="button" class="sticker-btn" onclick="addSticker('🥂')">🥂</button>
          <button type="button" class="sticker-btn" onclick="addSticker('🎉')">🎉</button>
          <button type="button" class="sticker-btn" onclick="addSticker('💌')">💌</button>
          <button type="button" class="sticker-btn" onclick="addSticker('✨')">✨</button>
        </div>
      </div>

      <!-- 祝福文字 -->
      <div>
        <div class="tool-group-title">祝福文字</div>
        <div class="text-input-group">
          <input type="text" id="wishText" placeholder="寫下祝福（如：百年好合！）">
          <button type="button" class="btn btn-action" onclick="addWishText()">放入</button>
        </div>
      </div>

      <!-- 下載圖片 -->
      <div style="margin-top: 10px;">
        <button type="button" class="btn-export" onclick="exportImage()">📷 下載當前結婚書約圖檔</button>
      </div>

    </div>

  </div>

  <script>
    let currentTab = 1;
    let isAdmin = false;
    let mode = 'pen'; // 'pen' | 'eraser'
    const ADMIN_PASSWORD = "muchmore828";

    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasContainer');
    const certCard = document.getElementById('certCard');

    let isDrawing = false;
    let strokeColor = '#2b2b2b';
    let baseBrushSize = 4;
    let eraserSize = 25;
    let dpr = window.devicePixelRatio || 1;

    let points = [];
    let sessionStrokes = [];
    let permanentImageObj = null;

    const defaultImages = {
      1: "https://muchmore828.github.io/wedding/Style%20A-%20Family.png",
      2: "https://muchmore828.github.io/wedding/Style%20B-%20Family.png"
    };

    const store = {
      1: { bg: defaultImages[1], permanentCanvasData: null, elements: [], aspect: null },
      2: { bg: defaultImages[2], permanentCanvasData: null, elements: [], aspect: null }
    };

    function init() {
      const savedData = localStorage.getItem('wedding_cert_store_v3');
      if (savedData) {
        try {
          const parsed = JSON.parse(savedData);
          if (parsed[1]) store[1] = { ...parsed[1], bg: defaultImages[1] };
          if (parsed[2]) store[2] = { ...parsed[2], bg: defaultImages[2] };
        } catch (e) {
          console.error(e);
        }
      }

      preloadImage(1);
      preloadImage(2);

      loadTabData(1);
      window.addEventListener('resize', handleResize);
    }

    function toggleAdminMode(checked) {
      if (checked) {
        const pwd = prompt("請輸入管理者密碼：");
        if (pwd === ADMIN_PASSWORD) {
          isAdmin = true;
          document.getElementById('adminControls').style.display = 'block';
          document.getElementById('eraserBtn').style.display = 'inline-flex';
        } else {
          alert("密碼錯誤，無法開啟管理者權限！");
          document.getElementById('adminToggle').checked = false;
          isAdmin = false;
          document.getElementById('adminControls').style.display = 'none';
          document.getElementById('eraserBtn').style.display = 'none';
          setMode('pen');
        }
      } else {
        isAdmin = false;
        document.getElementById('adminControls').style.display = 'none';
        document.getElementById('eraserBtn').style.display = 'none';
        setMode('pen');
      }
    }

    function setMode(newMode) {
      if (newMode === 'eraser' && !isAdmin) return;
      mode = newMode;
      document.getElementById('penBtn').classList.toggle('active', mode === 'pen');
      document.getElementById('eraserBtn').classList.toggle('active', mode === 'eraser');
      
      if (mode === 'pen') {
        document.getElementById('currentToolText').innerText = '【鋼筆筆刷】';
        document.getElementById('eraserSizeContainer').style.display = 'none';
        document.getElementById('colorRow').style.display = 'flex';
      } else {
        document.getElementById('currentToolText').innerText = '【管理者橡皮擦】';
        document.getElementById('eraserSizeContainer').style.display = 'block';
        document.getElementById('colorRow').style.display = 'none';
      }
    }

    function adminResetCurrentStyle() {
      if (!isAdmin) return;
      if (confirm(`⚠ 確定要徹底清空 款式 ${currentTab === 1 ? 'A' : 'B'} 的所有歷史筆跡與貼圖嗎？此動作無法復原！`)) {
        store[currentTab].permanentCanvasData = null;
        store[currentTab].elements = [];
        sessionStrokes = [];
        permanentImageObj = null;

        document.querySelectorAll('.draggable-item').forEach(el => el.remove());
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        saveToLocalStorage();
        alert("已完全清空該款式的筆跡與貼圖！");
      }
    }

    function preloadImage(tabIndex) {
      const img = new Image();
      img.onload = function() {
        store[tabIndex].aspect = img.width / img.height;
        if (currentTab === tabIndex) {
          adjustCardAspectRatio(store[tabIndex].aspect);
        }
      };
      img.src = store[tabIndex].bg;
    }

    function commitSessionToPermanent() {
      if (sessionStrokes.length > 0 || mode === 'eraser' || !store[currentTab].permanentCanvasData) {
        store[currentTab].permanentCanvasData = canvas.toDataURL();
        sessionStrokes = [];
        
        permanentImageObj = new Image();
        permanentImageObj.src = store[currentTab].permanentCanvasData;
      }
      localStorage.setItem('wedding_cert_store_v3', JSON.stringify(store));
    }

    function saveToLocalStorage() {
      commitSessionToPermanent();
    }

    function adjustCardAspectRatio(aspectRatio) {
      if (aspectRatio) {
        const width = certCard.clientWidth;
        certCard.style.height = (width / aspectRatio) + 'px';
      } else {
        certCard.style.height = '650px';
      }
      resizeCanvas();
    }

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;

      const tempImgData = canvas.toDataURL();

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';

      ctx.scale(dpr, dpr);

      if (tempImgData && tempImgData !== 'data:,') {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
        img.src = tempImgData;
      }
    }

    function handleResize() {
      if (store[currentTab].aspect) {
        adjustCardAspectRatio(store[currentTab].aspect);
      } else {
        resizeCanvas();
      }
    }

    function switchTab(tabIndex) {
      if (currentTab === tabIndex) return;

      commitSessionToPermanent();

      currentTab = tabIndex;
      document.getElementById('tab1').classList.toggle('active', tabIndex === 1);
      document.getElementById('tab2').classList.toggle('active', tabIndex === 2);

      loadTabData(tabIndex);
    }

    function loadTabData(tabIndex) {
      document.querySelectorAll('.draggable-item').forEach(el => el.remove());

      certCard.style.backgroundImage = `url("${store[tabIndex].bg}")`;
      adjustCardAspectRatio(store[tabIndex].aspect);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      sessionStrokes = [];

      if (store[tabIndex].permanentCanvasData) {
        permanentImageObj = new Image();
        permanentImageObj.onload = () => {
          redrawFullCanvas();
        };
        permanentImageObj.src = store[tabIndex].permanentCanvasData;
      } else {
        permanentImageObj = null;
        redrawFullCanvas();
      }

      if (store[tabIndex].elements) {
        store[tabIndex].elements.forEach(data => {
          createDraggableElement(data.html, data.left, data.top, false);
        });
      }
    }

    function redrawFullCanvas() {
      const rect = container.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      if (permanentImageObj) {
        ctx.drawImage(permanentImageObj, 0, 0, rect.width, rect.height);
      }
      sessionStrokes.forEach(stroke => {
        renderStrokeSmooth(stroke);
      });
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top,
        time: Date.now()
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      const pos = getPos(e);
      points = [pos, pos];
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      points.push(pos);

      const p1 = points[points.length - 2];
      const p2 = points[points.length - 1];

      ctx.beginPath();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (mode === 'eraser' && isAdmin) {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = eraserSize;
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = strokeColor;

        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const time = (p2.time - p1.time) || 1;
        const velocity = dist / time;

        let dynamicWidth = Math.max(baseBrushSize * 0.4, baseBrushSize * (1.1 - velocity * 0.12));

        const xc = (p1.x + p2.x) / 2;
        const yc = (p1.y + p2.y) / 2;

        ctx.lineWidth = dynamicWidth;
        ctx.quadraticCurveTo(p1.x, p1.y, xc, yc);
        ctx.stroke();
      }
    }

    function stopDrawing() {
      if (isDrawing) {
        isDrawing = false;
        if (mode === 'pen' && points.length > 1) {
          sessionStrokes.push({
            color: strokeColor,
            size: baseBrushSize,
            points: [...points]
          });
        }
        points = [];
        
        if (mode === 'eraser' && isAdmin) {
          commitSessionToPermanent();
        }
      }
    }

    function renderStrokeSmooth(stroke) {
      if (!stroke.points || stroke.points.length < 2) return;

      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = stroke.color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const pts = stroke.points;
      const baseSize = stroke.size || 4;

      for (let i = 1; i < pts.length; i++) {
        const p1 = pts[i - 1];
        const p2 = pts[i];

        const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const time = (p2.time - p1.time) || 1;
        const velocity = dist / time;

        let dynamicWidth = Math.max(baseSize * 0.4, baseSize * (1.1 - velocity * 0.12));

        const xc = (p1.x + p2.x) / 2;
        const yc = (p1.y + p2.y) / 2;

        ctx.beginPath();
        ctx.lineWidth = dynamicWidth;
        ctx.moveTo(p1.x, p1.y);
        ctx.quadraticCurveTo(p1.x, p1.y, xc, yc);
        ctx.stroke();
      }
    }

    function undoMyStroke() {
      if (sessionStrokes.length > 0) {
        sessionStrokes.pop();
        redrawFullCanvas();
      } else {
        alert("您在本次連線中沒有剛繪製的筆劃可供復原囉！");
      }
    }

    function clearMySessionStrokes() {
      if (sessionStrokes.length > 0) {
        sessionStrokes = [];
        redrawFullCanvas();
      } else {
        alert("您目前沒有繪製中的個人筆跡！");
      }
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);

    function setColor(color, el) {
      strokeColor = color;
      document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
      el.classList.add('active');
      if (mode === 'eraser') setMode('pen');
    }

    function setBrushSize(size) { baseBrushSize = parseFloat(size); }
    function setEraserSize(size) { eraserSize = parseFloat(size); }

    function makeDraggable(el) {
      let isDragging = false;
      let offsetX, offsetY;

      const onStart = (e) => {
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const rect = el.getBoundingClientRect();
        offsetX = clientX - rect.left;
        offsetY = clientY - rect.top;
      };

      const onMove = (e) => {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const containerRect = container.getBoundingClientRect();

        let left = clientX - containerRect.left - offsetX;
        let top = clientY - containerRect.top - offsetY;

        el.style.left = left + 'px';
        el.style.top = top + 'px';
      };

      const onEnd = () => {
        if (isDragging) {
          isDragging = false;
          saveElementsState();
        }
      };

      el.addEventListener('mousedown', onStart);
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onEnd);

      el.addEventListener('touchstart', onStart);
      document.addEventListener('touchmove', onMove);
      document.addEventListener('touchend', onEnd);
    }

    function createDraggableElement(html, left = '40%', top = '30%', isNew = true) {
      const item = document.createElement('div');
      item.className = 'draggable-item';
      item.style.left = left;
      item.style.top = top;
      item.innerHTML = `${html} <span class="delete-btn" onclick="this.parentElement.remove(); saveElementsState();">✕</span>`;
      container.appendChild(item);
      makeDraggable(item);
      if (isNew) saveElementsState();
    }

    function saveElementsState() {
      const elementsData = [];
      document.querySelectorAll('.draggable-item').forEach(el => {
        const clone = el.cloneNode(true);
        const delBtn = clone.querySelector('.delete-btn');
        if (delBtn) delBtn.remove();
        elementsData.push({
          html: clone.innerHTML,
          left: el.style.left,
          top: el.style.top
        });
      });
      store[currentTab].elements = elementsData;
      commitSessionToPermanent();
    }

    function addSticker(sticker) {
      createDraggableElement(`<span style="font-size:1.8rem;">${sticker}</span>`, '40%', '30%');
    }

    function addWishText() {
      const textInput = document.getElementById('wishText');
      const text = textInput.value.trim();
      if (!text) return;
      createDraggableElement(`<span style="color:${strokeColor}; font-weight:500; font-family:'Zen Maru Gothic', sans-serif;">${text}</span>`, '30%', '40%');
      textInput.value = '';
    }

    function exportImage() {
      commitSessionToPermanent();
      document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = 'none');
      html2canvas(document.getElementById('certificateNode'), { scale: 2, useCORS: true }).then(c => {
        const link = document.createElement('a');
        link.download = `結婚書約_款式${currentTab === 1 ? 'A' : 'B'}_親友簽名版.png`;
        link.href = c.toDataURL('image/png');
        link.click();
        document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = '');
      });
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
