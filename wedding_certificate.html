<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子結婚書約 - 雙款式親友接續簽名</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary-color: #d4a373;
      --primary-dark: #bc8a5f;
      --bg-color: #fefae0;
      --card-bg: #ffffff;
      --text-color: #4a3f35;
      --accent-color: #e76f51;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    .header-title {
      text-align: center;
      margin-bottom: 15px;
    }

    .header-title h1 {
      font-size: 1.8rem;
      color: var(--primary-dark);
      letter-spacing: 2px;
    }

    .header-title p {
      font-size: 0.95rem;
      color: #8d7b68;
      margin-top: 5px;
    }

    /* 頁籤切換按鈕區 */
    .tab-container {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      width: 100%;
      max-width: 1100px;
      justify-content: center;
      position: relative;
      z-index: 100;
    }

    .tab-btn {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: 2px solid var(--primary-color);
      background: #fff;
      color: var(--primary-dark);
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary-dark);
      color: #fff;
      border-color: var(--primary-dark);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 1100px;
    }

    @media (min-width: 900px) {
      .app-container {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    /* 結婚書約顯示區域 */
    .certificate-wrapper {
      flex: 1;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 15px;
      position: relative;
      border: 1px solid #faedcd;
    }

    .certificate-card {
      position: relative;
      width: 100%;
      min-height: 500px;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 8px;
      overflow: hidden;
      margin: 0 auto;
    }

    /* Canvas 全圖覆蓋繪圖層 */
    .canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 工具面板 */
    .tools-panel {
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
      z-index: 100;
    }

    @media (min-width: 900px) {
      .tools-panel {
        width: 320px;
      }
    }

    .tool-group-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--primary-dark);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 12px;
      border: 1px solid var(--primary-color);
      background: #fff;
      color: var(--primary-dark);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn:hover { background: var(--primary-color); color: #fff; }
    .btn.active { background: var(--primary-dark); color: #fff; border-color: var(--primary-dark); }
    .btn-action { background: var(--primary-color); color: white; border: none; font-weight: bold; }

    .btn-export {
      background: var(--accent-color);
      color: white;
      border: none;
      font-size: 1rem;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(231, 111, 81, 0.3);
    }

    .color-options { display: flex; gap: 8px; }
    .color-dot {
      width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
      border: 2px solid #fff; box-shadow: 0 0 0 1px #ccc;
    }
    .color-dot.active { transform: scale(1.15); box-shadow: 0 0 0 2px var(--primary-dark); }

    .sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .sticker-btn {
      font-size: 1.5rem; padding: 6px; background: #fefae0;
      border: 1px solid #e9edc9; border-radius: 6px; cursor: pointer; text-align: center;
    }

    .text-input-group { display: flex; gap: 6px; }
    .text-input-group input { flex: 1; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }

    .draggable-item {
      position: absolute; cursor: move; user-select: none; padding: 4px 8px;
      border-radius: 4px; display: flex; align-items: center; gap: 4px; font-size: 1.2rem; z-index: 50;
    }
    .draggable-item:hover { border: 1px dashed #d4a373; background: rgba(255, 255, 255, 0.8); }
    .draggable-item .delete-btn { display: none; color: red; font-weight: bold; cursor: pointer; margin-left: 4px; }
    .draggable-item:hover .delete-btn { display: inline; }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <div class="header-title">
    <h1>電子結婚書約 - 線上簽名與祝福</h1>
    <p>切換款式即可選擇想簽名的書約，所有筆跡與祝福都會自動儲存！</p>
  </div>

  <!-- 雙頁籤 -->
  <div class="tab-container">
    <button type="button" class="tab-btn active" id="tab1" onclick="switchTab(1)">📜 結婚書約款式一</button>
    <button type="button" class="tab-btn" id="tab2" onclick="switchTab(2)">🎨 結婚書約款式二</button>
  </div>

  <div class="app-container">
    
    <!-- 結婚書約圖片與繪圖區 -->
    <div class="certificate-wrapper" id="certificateNode">
      <div class="certificate-card" id="certCard">
        <div class="canvas-container" id="canvasContainer">
          <canvas id="drawingCanvas"></canvas>
        </div>
      </div>
    </div>

    <!-- 控制工具面板 -->
    <div class="tools-panel">
      
      <!-- 底圖上傳 -->
      <div>
        <div class="tool-group-title">更換這張款式的底圖</div>
        <label class="btn btn-action" style="width: 100%; justify-content: center; padding: 10px;">
          🖼 上傳當前款式的書約底圖
          <input type="file" accept="image/*" onchange="uploadCurrentBackground(event)">
        </label>
      </div>

      <!-- 畫筆模式 -->
      <div>
        <div class="tool-group-title">
          <span>畫筆工具</span>
          <span id="currentToolText" style="font-size:0.8rem; color:#888;">【畫筆模式】</span>
        </div>
        <div class="btn-row">
          <button type="button" class="btn active" id="penBtn" onclick="setMode('pen')">✏️ 畫筆</button>
          <button type="button" class="btn" id="eraserBtn" onclick="setMode('eraser')">🧹 橡皮擦</button>
        </div>
      </div>

      <!-- 步驟管理 -->
      <div>
        <div class="tool-group-title">步驟管理</div>
        <div class="btn-row">
          <button type="button" class="btn" onclick="undo()">↩️ 復原 (Undo)</button>
          <button type="button" class="btn" onclick="redo()">↪ 重做 (Redo)</button>
          <button type="button" class="btn" onclick="clearCanvas()">🗑️ 清空此版筆劃</button>
        </div>
      </div>

      <!-- 顏色與大小 -->
      <div>
        <div class="tool-group-title">筆刷設定</div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div class="color-options">
            <div class="color-dot active" style="background:#2b2b2b;" onclick="setColor('#2b2b2b', this)"></div>
            <div class="color-dot" style="background:#e76f51;" onclick="setColor('#e76f51', this)"></div>
            <div class="color-dot" style="background:#2a9d8f;" onclick="setColor('#2a9d8f', this)"></div>
            <div class="color-dot" style="background:#457b9d;" onclick="setColor('#457b9d', this)"></div>
          </div>
          <div>
            <input type="range" id="brushSize" min="2" max="20" value="3" onchange="setBrushSize(this.value)">
          </div>
        </div>
      </div>

      <!-- 可愛貼圖 -->
      <div>
        <div class="tool-group-title">點擊添加貼圖（可拖曳）</div>
        <div class="sticker-grid">
          <button type="button" class="sticker-btn" onclick="addSticker('❤️')">❤️</button>
          <button type="button" class="sticker-btn" onclick="addSticker('💍')">💍</button>
          <button type="button" class="sticker-btn" onclick="addSticker('💐')">💐</button>
          <button type="button" class="sticker-btn" onclick="addSticker('🐱')">🐱</button>
          <button type="button" class="sticker-btn" onclick="addSticker('🥂')">🥂</button>
          <button type="button" class="sticker-btn" onclick="addSticker('🎉')">🎉</button>
          <button type="button" class="sticker-btn" onclick="addSticker('💌')">💌</button>
          <button type="button" class="sticker-btn" onclick="addSticker('✨')">✨</button>
        </div>
      </div>

      <!-- 祝福文字 -->
      <div>
        <div class="tool-group-title">輸入祝福文字</div>
        <div class="text-input-group">
          <input type="text" id="wishText" placeholder="寫下祝福（如：百年好合！）">
          <button type="button" class="btn btn-action" onclick="addWishText()">放入</button>
        </div>
      </div>

      <!-- 下載圖片 -->
      <div style="margin-top: 10px;">
        <button type="button" class="btn-export" onclick="exportImage()">📷 下載當前結婚書約圖檔</button>
      </div>

    </div>

  </div>

  <script>
    let currentTab = 1;
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasContainer');
    const certCard = document.getElementById('certCard');

    let isDrawing = false;
    let mode = 'pen';
    let strokeColor = '#2b2b2b';
    let brushSize = 3;

    // 儲存兩張頁籤各自的資料 (含寬高比 aspect)
    const store = {
      1: { bg: '', canvasData: null, elements: [], aspect: null },
      2: { bg: '', canvasData: null, elements: [], aspect: null }
    };

    function init() {
      const savedData = localStorage.getItem('wedding_cert_store');
      if (savedData) {
        try {
          const parsed = JSON.parse(savedData);
          if (parsed[1]) store[1] = parsed[1];
          if (parsed[2]) store[2] = parsed[2];
        } catch (e) {
          console.error(e);
        }
      }
      loadTabData(1);
      window.addEventListener('resize', handleResize);
    }

    function saveToLocalStorage() {
      store[currentTab].canvasData = canvas.toDataURL();
      localStorage.setItem('wedding_cert_store', JSON.stringify(store));
    }

    function adjustCardAspectRatio(aspectRatio) {
      if (aspectRatio) {
        const width = certCard.clientWidth;
        certCard.style.height = (width / aspectRatio) + 'px';
      } else {
        certCard.style.height = '650px';
      }
      resizeCanvas();
    }

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      // 先備份舊筆跡避免 resize 導致畫面變空白
      const tempImgData = canvas.toDataURL();
      canvas.width = rect.width;
      canvas.height = rect.height;

      if (tempImgData && tempImgData !== 'data:,') {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        img.src = tempImgData;
      }
    }

    function handleResize() {
      if (store[currentTab].aspect) {
        adjustCardAspectRatio(store[currentTab].aspect);
      } else {
        resizeCanvas();
      }
    }

    function switchTab(tabIndex) {
      if (currentTab === tabIndex) return;

      saveToLocalStorage();

      currentTab = tabIndex;
      document.getElementById('tab1').classList.toggle('active', tabIndex === 1);
      document.getElementById('tab2').classList.toggle('active', tabIndex === 2);

      loadTabData(tabIndex);
    }

    function loadTabData(tabIndex) {
      document.querySelectorAll('.draggable-item').forEach(el => el.remove());

      if (store[tabIndex].bg) {
        certCard.style.backgroundImage = `url(${store[tabIndex].bg})`;
        adjustCardAspectRatio(store[tabIndex].aspect);
      } else {
        certCard.style.backgroundImage = 'none';
        adjustCardAspectRatio(null);
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (store[tabIndex].canvasData) {
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
        img.src = store[tabIndex].canvasData;
      }

      if (store[tabIndex].elements) {
        store[tabIndex].elements.forEach(data => {
          createDraggableElement(data.html, data.left, data.top, false);
        });
      }
    }

    function uploadCurrentBackground(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
            const aspect = img.width / img.height;
            store[currentTab].bg = event.target.result;
            store[currentTab].aspect = aspect;

            certCard.style.backgroundImage = `url(${event.target.result})`;
            adjustCardAspectRatio(aspect);
            saveToLocalStorage();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDrawing(e) {
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);

      ctx.lineWidth = mode === 'eraser' ? brushSize * 4 : brushSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (mode === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = strokeColor;
      }

      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (isDrawing) {
        isDrawing = false;
        ctx.closePath();
        saveToLocalStorage();
      }
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);

    function undo() { clearCanvas(); }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      saveToLocalStorage();
    }

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('penBtn').classList.toggle('active', mode === 'pen');
      document.getElementById('eraserBtn').classList.toggle('active', mode === 'eraser');
      document.getElementById('currentToolText').innerText = mode === 'pen' ? '【畫筆模式】' : '【橡皮擦模式】';
    }

    function setColor(color, el) {
      strokeColor = color;
      document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
      el.classList.add('active');
      if (mode === 'eraser') setMode('pen');
    }

    function setBrushSize(size) { brushSize = size; }

    function makeDraggable(el) {
      let isDragging = false;
      let offsetX, offsetY;

      const onStart = (e) => {
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const rect = el.getBoundingClientRect();
        offsetX = clientX - rect.left;
        offsetY = clientY - rect.top;
      };

      const onMove = (e) => {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const containerRect = container.getBoundingClientRect();

        let left = clientX - containerRect.left - offsetX;
        let top = clientY - containerRect.top - offsetY;

        el.style.left = left + 'px';
        el.style.top = top + 'px';
      };

      const onEnd = () => {
        if (isDragging) {
          isDragging = false;
          saveElementsState();
        }
      };

      el.addEventListener('mousedown', onStart);
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onEnd);

      el.addEventListener('touchstart', onStart);
      document.addEventListener('touchmove', onMove);
      document.addEventListener('touchend', onEnd);
    }

    function createDraggableElement(html, left = '40%', top = '30%', isNew = true) {
      const item = document.createElement('div');
      item.className = 'draggable-item';
      item.style.left = left;
      item.style.top = top;
      item.innerHTML = `${html} <span class="delete-btn" onclick="this.parentElement.remove(); saveElementsState();">✕</span>`;
      container.appendChild(item);
      makeDraggable(item);
      if (isNew) saveElementsState();
    }

    function saveElementsState() {
      const elementsData = [];
      document.querySelectorAll('.draggable-item').forEach(el => {
        const clone = el.cloneNode(true);
        const delBtn = clone.querySelector('.delete-btn');
        if (delBtn) delBtn.remove();
        elementsData.push({
          html: clone.innerHTML,
          left: el.style.left,
          top: el.style.top
        });
      });
      store[currentTab].elements = elementsData;
      saveToLocalStorage();
    }

    function addSticker(sticker) {
      createDraggableElement(`<span style="font-size:1.8rem;">${sticker}</span>`, '40%', '30%');
    }

    function addWishText() {
      const textInput = document.getElementById('wishText');
      const text = textInput.value.trim();
      if (!text) return;
      createDraggableElement(`<span style="color:${strokeColor}; font-weight:bold;">${text}</span>`, '30%', '40%');
      textInput.value = '';
    }

    function exportImage() {
      document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = 'none');
      html2canvas(document.getElementById('certificateNode'), { scale: 2, useCORS: true }).then(c => {
        const link = document.createElement('a');
        link.download = `結婚書約_款式${currentTab}_親友簽名版.png`;
        link.href = c.toDataURL('image/png');
        link.click();
        document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = '');
      });
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
