<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子結婚書約 - 親友手寫與打字祝福牆</title>
  
  <!-- Google Fonts: Zen Maru Gothic & Kiwi Maru -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- html2canvas for export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --primary-color: #c59b6c;
      --primary-dark: #a0784a;
      --bg-color: #fcf8f2;
      --card-bg: #ffffff;
      --text-color: #4a3f35;
      --accent-color: #e76f51;
      --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
      --shadow-lg: 0 12px 30px rgba(0,0,0,0.08);
      --font-handwriting: 'Zen Maru Gothic', 'Kiwi Maru', 'PingFang TC', cursive, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-handwriting);
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 12px;
      background-image: radial-gradient(#e2d5c3 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .header-title {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-title h1 {
      font-size: 2.1rem;
      color: var(--primary-dark);
      letter-spacing: 2px;
      font-weight: 700;
      text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
    }

    .header-title p {
      font-size: 1rem;
      color: #8d7b68;
      margin-top: 6px;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 1200px;
    }

    @media (min-width: 960px) {
      .app-container {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    /* 左側主區域：結婚書約 + 下方祝福牆 */
    .certificate-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .certificate-card-node {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      padding: 20px;
      position: relative;
      border: 1px solid #f0e6d6;
      overflow: hidden;
    }

    .certificate-card {
      position: relative;
      width: 100%;
      min-height: 520px;
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 10px;
      overflow: hidden;
      margin: 0 auto;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
    }

    /* Canvas 覆蓋繪圖層 */
    .canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 方案二：專屬親友簽名與祝福牆方格 */
    .blessing-wall-container {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow-lg);
      border: 2px dashed #ebdccb;
    }

    .wall-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f2e6d8;
    }

    .wall-title-bar h2 {
      font-size: 1.25rem;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wall-count-badge {
      background: #f7ede2;
      color: var(--primary-dark);
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
    }

    .blessing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      min-height: 120px;
    }

    .blessing-empty-tip {
      grid-column: 1 / -1;
      text-align: center;
      padding: 30px 10px;
      color: #a09283;
      font-size: 0.95rem;
      background: #fdfbf7;
      border-radius: 12px;
      border: 1px dashed #e6dbcc;
    }

    /* 祝福卡片風格 */
    .blessing-card {
      position: relative;
      padding: 14px 16px;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(0,0,0,0.05);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    .blessing-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
    }

    /* 不同配色樣式 */
    .card-style-pink { background: #fff5f5; border-left: 5px solid #f4a261; color: #5a3e36; }
    .card-style-wood { background: #faf4ed; border-left: 5px solid #a0784a; color: #4a3f35; }
    .card-style-yellow { background: #fffdf0; border-left: 5px solid #e9c46a; color: #524733; }
    .card-style-green { background: #f2f9f6; border-left: 5px solid #2a9d8f; color: #2d4843; }

    .card-delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255,255,255,0.8);
      border: none;
      color: #e76f51;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      line-height: 22px;
      text-align: center;
      transition: all 0.15s;
    }

    .card-delete-btn:hover {
      background: #e76f51;
      color: #fff;
    }

    .card-body-text {
      font-size: 0.98rem;
      line-height: 1.5;
      margin-bottom: 12px;
      word-break: break-word;
      font-weight: 500;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 8px;
      border-top: 1px dashed rgba(0,0,0,0.08);
    }

    .card-author {
      font-weight: 700;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-date {
      font-size: 0.72rem;
      opacity: 0.65;
    }

    /* 右側控制面板 */
    .tools-panel {
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      z-index: 100;
      border: 1px solid #f0e6d6;
    }

    @media (min-width: 960px) {
      .tools-panel {
        width: 360px;
      }
    }

    /* 右側頁籤切換按鈕區 */
    .tab-container {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      font-size: 1rem;
      font-weight: 700;
      font-family: var(--font-handwriting);
      border: 2px solid var(--primary-color);
      background: #fff;
      color: var(--primary-dark);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .tab-btn.active {
      background: var(--primary-dark);
      color: #fff;
      border-color: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(160, 120, 74, 0.3);
    }

    .tool-section {
      border-bottom: 1px dashed #eee3d3;
      padding-bottom: 16px;
    }

    .tool-section:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .tool-group-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge-protected {
      font-size: 0.75rem;
      background-color: #e8f5e9;
      color: #2e7d32;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: normal;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 14px;
      border: 1px solid var(--primary-color);
      background: #fff;
      color: var(--primary-dark);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-family: var(--font-handwriting);
      font-weight: 500;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover { background: #faf4ed; }
    .btn.active { background: var(--primary-dark); color: #fff; border-color: var(--primary-dark); }
    .btn-action { background: var(--primary-color); color: white; border: none; font-weight: bold; width: 100%; padding: 12px; }
    .btn-action:hover { background: var(--primary-dark); }
    .btn-admin { background: #fff1f0; color: #d9363e; border-color: #ffa39e; }
    .btn-admin:hover { background: #ffccc7; }

    .btn-export {
      background: linear-gradient(135deg, #e76f51, #f4a261);
      color: white;
      border: none;
      font-size: 1.05rem;
      padding: 14px;
      width: 100%;
      border-radius: 10px;
      font-weight: 700;
      font-family: var(--font-handwriting);
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(231, 111, 81, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-export:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(231, 111, 81, 0.45);
    }

    /* 筆刷顏色選擇器 */
    .color-options { display: flex; gap: 10px; align-items: center; }
    .color-dot {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      border: 2px solid #fff; box-shadow: 0 0 0 1px #ddd;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .color-dot:hover { transform: scale(1.1); }
    .color-dot.active { transform: scale(1.2); box-shadow: 0 0 0 2.5px var(--primary-dark); }

    /* 表單樣式 */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: #8d7b68;
    }

    .form-input {
      padding: 10px 12px;
      border: 1px solid #dcd1c4;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: var(--font-handwriting);
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus { border-color: var(--primary-color); }

    /* 訊息提示框 */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(74, 63, 53, 0.92);
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-family: var(--font-handwriting);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      pointer-events: none;
    }
    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
    }

    /* 密碼彈窗 Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      display: flex; justify-content: center; align-items: center;
      z-index: 2000;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 380px;
      box-shadow: var(--shadow-lg);
      font-family: var(--font-handwriting);
      text-align: center;
    }
    .modal-box h3 { margin-bottom: 12px; color: var(--primary-dark); }
    .modal-box input {
      width: 100%; padding: 10px; margin: 12px 0 18px;
      border: 1px solid #dcd1c4; border-radius: 8px;
      font-size: 1rem; text-align: center; outline: none;
    }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
  </style>
</head>
<body>

  <div class="header-title">
    <h1>✒️ 電子結婚書約 - 祝福與簽名牆</h1>
    <p>親友可選擇親筆手寫筆觸，或打字留下祝福方格！</p>
  </div>

  <div class="app-container">
    
    <!-- 左側區域：結婚書約 + 下方親友簽名與祝福牆 -->
    <div class="certificate-wrapper" id="certificateNode">
      
      <!-- 書約卡片與畫布 -->
      <div class="certificate-card-node">
        <div class="certificate-card" id="certCard">
          <div class="canvas-container" id="canvasContainer">
            <canvas id="drawingCanvas"></canvas>
          </div>
        </div>
      </div>

      <!-- 方案二：親友專屬簽名與祝福牆方格網格 -->
      <div class="blessing-wall-container">
        <div class="wall-title-bar">
          <h2>💌 親友簽名與祝福牆</h2>
          <span class="wall-count-badge" id="wallCountBadge">已收到 0 份祝福</span>
        </div>
        <div class="blessing-grid" id="blessingGrid">
          <div class="blessing-empty-tip" id="emptyTip">
            🌸 目前尚無留言，歡迎在右側「打字快速簽名」留下給新人的第一份祝福！
          </div>
        </div>
      </div>

    </div>

    <!-- 右側控制工具面板 -->
    <div class="tools-panel">
      
      <!-- 右側頁籤切換 -->
      <div class="tool-section">
        <div class="tool-group-title">選擇結婚書約款式</div>
        <div class="tab-container">
          <button type="button" class="tab-btn active" id="tab1" onclick="switchTab(1)">📜 書約款式 A</button>
          <button type="button" class="tab-btn" id="tab2" onclick="switchTab(2)">🎨 書約款式 B</button>
        </div>
      </div>

      <!-- ✍️ 方案二：打字快速簽名與祝福表單 -->
      <div class="tool-section">
        <div class="tool-group-title">✍️ 打字快速簽名與留言</div>
        
        <div class="form-group">
          <label for="authorInput">簽名 / 您的姓名</label>
          <input type="text" id="authorInput" class="form-input" placeholder="例如：陳小明 / 姑姑">
        </div>

        <div class="form-group">
          <label for="blessingInput">祝福的話</label>
          <input type="text" id="blessingInput" class="form-input" placeholder="例如：百年好合，永結同心！">
        </div>

        <div class="form-group">
          <label for="cardStyleSelect">卡片款式風格</label>
          <select id="cardStyleSelect" class="form-input">
            <option value="card-style-pink">🌸 雅緻粉</option>
            <option value="card-style-wood">🪵 溫潤木</option>
            <option value="card-style-yellow">☀️ 晨曦黃</option>
            <option value="card-style-green">🌿 清新綠</option>
          </select>
        </div>

        <button type="button" class="btn btn-action" onclick="submitBlessingCard()">💌 送出簽名與祝福</button>
      </div>

      <!-- 鋼筆筆刷設定 (繪圖) -->
      <div class="tool-section">
        <div class="tool-group-title">
          <span>✍️ 親筆繪圖與極速原子筆</span>
          <span style="font-size:0.8rem; color:#a0784a; font-weight:normal;">極速 pointerrawupdate</span>
        </div>
        
        <div style="margin-bottom: 12px;">
          <div style="font-size: 0.85rem; color: #8d7b68; margin-bottom: 6px;">墨水顏色</div>
          <div class="color-options">
            <div class="color-dot active" style="background:#2b2b2b;" title="經典墨黑" onclick="setColor('#2b2b2b', this)"></div>
            <div class="color-dot" style="background:#1d3557;" title="優雅藍" onclick="setColor('#1d3557', this)"></div>
            <div class="color-dot" style="background:#2a9d8f;" title="森林綠" onclick="setColor('#2a9d8f', this)"></div>
            <div class="color-dot" style="background:#e76f51;" title="暖橘" onclick="setColor('#e76f51', this)"></div>
            <div class="color-dot" style="background:#6a4c93;" title="夢幻紫" onclick="setColor('#6a4c93', this)"></div>
          </div>
        </div>

        <div>
          <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: #8d7b68; margin-bottom: 4px;">
            <span>筆頭粗細</span>
            <span id="brushSizeVal">3.0 px</span>
          </div>
          <input type="range" id="brushSize" min="1.5" max="8" step="0.5" value="3" style="width: 100%; accent-color: var(--primary-dark);" oninput="setBrushSize(this.value)">
        </div>
      </div>

      <!-- 簽名復原與步驟管理 -->
      <div class="tool-section">
        <div class="tool-group-title">
          <span>簽名紀錄管理</span>
          <span class="badge-protected">🛡️ 歷史保護中</span>
        </div>
        <div class="btn-row">
          <button type="button" class="btn" onclick="undoMyStroke()">↩ 復原筆劃</button>
          <button type="button" class="btn" onclick="clearMySessionStrokes()">🗑️ 清除本次畫筆</button>
          <button type="button" class="btn btn-admin" onclick="openAdminModal()">🔐 管理者清空</button>
        </div>
      </div>

      <!-- 下載圖片 -->
      <div style="margin-top: 6px;">
        <button type="button" class="btn-export" onclick="exportImage()">📷 匯出高畫質結婚書約全圖</button>
      </div>

    </div>

  </div>

  <div class="toast-msg" id="toast">提示訊息</div>

  <!-- 管理者解鎖密碼對話框 -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-box">
      <h3>🔐 管理者權限解鎖</h3>
      <p style="font-size:0.88rem; color:#8d7b68;">輸入密碼即可清空此款式之「全體親友歷史筆劃與祝福牆」</p>
      <input type="password" id="adminPassword" placeholder="請輸入管理者密碼">
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeAdminModal()">取消</button>
        <button type="button" class="btn btn-admin" onclick="confirmAdminClear()">確認徹底清空</button>
      </div>
    </div>
  </div>

  <script>
    // 預設結婚書約背景圖片網址
    const defaultImages = {
      1: "https://muchmore828.github.io/wedding/Style%20A-%20Family.png",
      2: "https://muchmore828.github.io/wedding/Style%20B-%20Family.png"
    };

    let currentTab = 1;
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d', { desynchronized: true });
    const container = document.getElementById('canvasContainer');
    const certCard = document.getElementById('certCard');

    let isDrawing = false;
    let strokeColor = '#2b2b2b';
    let baseBrushSize = 3.0;

    let currentStrokePoints = [];
    let dpr = window.devicePixelRatio || 1;
    const imageCache = {};

    // 狀態儲存機制 (包含祝福牆資料)
    const store = {
      1: { bg: defaultImages[1], permanentImage: null, sessionStrokes: [], blessingCards: [], aspect: null },
      2: { bg: defaultImages[2], permanentImage: null, sessionStrokes: [], blessingCards: [], aspect: null }
    };

    function init() {
      // 載入 localStorage 資料
      const savedData = localStorage.getItem('wedding_cert_wall_v4');
      if (savedData) {
        try {
          const parsed = JSON.parse(savedData);
          if (parsed[1]) {
            store[1].permanentImage = parsed[1].permanentImage || null;
            store[1].blessingCards = parsed[1].blessingCards || [];
          }
          if (parsed[2]) {
            store[2].permanentImage = parsed[2].permanentImage || null;
            store[2].blessingCards = parsed[2].blessingCards || [];
          }
        } catch (e) {
          console.error(e);
        }
      }

      preloadImage(1);
      preloadImage(2);

      loadTabData(1);
      setupPointerEvents();
      window.addEventListener('resize', handleResize);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function preloadImage(tabIndex) {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = function() {
        store[tabIndex].aspect = img.width / img.height;
        if (currentTab === tabIndex) {
          adjustCardAspectRatio(store[tabIndex].aspect);
        }
      };
      img.src = store[tabIndex].bg;
    }

    function adjustCardAspectRatio(aspectRatio) {
      if (aspectRatio) {
        const width = certCard.clientWidth;
        certCard.style.height = (width / aspectRatio) + 'px';
      } else {
        certCard.style.height = '520px';
      }
      resizeCanvas();
    }

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      
      ctx.scale(dpr, dpr);
      redrawCurrentCanvas();
    }

    function handleResize() {
      if (store[currentTab].aspect) {
        adjustCardAspectRatio(store[currentTab].aspect);
      } else {
        resizeCanvas();
      }
    }

    function switchTab(tabIndex) {
      if (currentTab === tabIndex) return;

      commitSessionToPermanent();

      currentTab = tabIndex;
      document.getElementById('tab1').classList.toggle('active', tabIndex === 1);
      document.getElementById('tab2').classList.toggle('active', tabIndex === 2);

      loadTabData(tabIndex);
    }

    function loadTabData(tabIndex) {
      certCard.style.backgroundImage = `url("${store[tabIndex].bg}")`;
      adjustCardAspectRatio(store[tabIndex].aspect);

      redrawCurrentCanvas();
      renderBlessingCards();
    }

    function redrawCurrentCanvas() {
      const rect = container.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);

      const tabData = store[currentTab];

      if (tabData.permanentImage) {
        if (imageCache[tabData.permanentImage]) {
          ctx.drawImage(imageCache[tabData.permanentImage], 0, 0, rect.width, rect.height);
          renderSessionStrokes();
        } else {
          const img = new Image();
          img.onload = () => {
            imageCache[tabData.permanentImage] = img;
            ctx.drawImage(img, 0, 0, rect.width, rect.height);
            renderSessionStrokes();
          };
          img.src = tabData.permanentImage;
        }
      } else {
        renderSessionStrokes();
      }
    }

    function renderSessionStrokes() {
      const strokes = store[currentTab].sessionStrokes;
      strokes.forEach(stroke => {
        if (!stroke.points || stroke.points.length < 2) return;
        drawSmoothStroke(stroke.points, stroke.color, stroke.baseSize);
      });
    }

    /* ---------------- 超流暢原子筆 Pointer Events 繪圖機制 ---------------- */
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      return { 
        x: e.clientX - rect.left, 
        y: e.clientY - rect.top,
        pressure: e.pressure && e.pressure !== 0 ? e.pressure : 0.5
      };
    }

    function setupPointerEvents() {
      const handlePointerMove = (e) => {
        if (!isDrawing) return;
        
        let events = [e];
        if (e.getCoalescedEvents) {
          events = e.getCoalescedEvents();
        }

        events.forEach(ev => {
          const pos = getPointerPos(ev);
          const prevPos = currentStrokePoints[currentStrokePoints.length - 1];
          
          if (prevPos) {
            const dist = Math.hypot(pos.x - prevPos.x, pos.y - prevPos.y);
            if (dist < 0.8) return;
          }

          currentStrokePoints.push(pos);
        });

        redrawCurrentCanvas();
        drawSmoothStroke(currentStrokePoints, strokeColor, baseBrushSize);
      };

      canvas.addEventListener('pointerdown', (e) => {
        isDrawing = true;
        canvas.setPointerCapture(e.pointerId);
        const pos = getPointerPos(e);
        currentStrokePoints = [pos];
      });

      canvas.addEventListener('pointermove', handlePointerMove);

      if (window.PointerEvent && 'onpointerrawupdate' in window) {
        canvas.addEventListener('pointerrawupdate', handlePointerMove);
      }

      const stopDrawing = (e) => {
        if (!isDrawing) return;
        isDrawing = false;
        try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}

        if (currentStrokePoints.length > 1) {
          store[currentTab].sessionStrokes.push({
            points: [...currentStrokePoints],
            color: strokeColor,
            baseSize: baseBrushSize
          });
        }
        currentStrokePoints = [];
      };

      canvas.addEventListener('pointerup', stopDrawing);
      canvas.addEventListener('pointercancel', stopDrawing);
    }

    function drawSmoothStroke(points, color, baseSize) {
      if (points.length < 2) return;

      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (points.length === 2) {
        ctx.beginPath();
        ctx.lineWidth = baseSize;
        ctx.moveTo(points[0].x, points[0].y);
        ctx.lineTo(points[1].x, points[1].y);
        ctx.stroke();
        ctx.restore();
        return;
      }

      for (let i = 1; i < points.length - 1; i++) {
        const p1 = points[i];
        const p2 = points[i + 1];
        
        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;

        ctx.beginPath();
        ctx.lineWidth = baseSize * (0.8 + (p1.pressure || 0.5) * 0.4);
        
        const startX = (i === 1) ? points[0].x : (points[i-1].x + p1.x) / 2;
        const startY = (i === 1) ? points[0].y : (points[i-1].y + p1.y) / 2;

        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(p1.x, p1.y, midX, midY);
        ctx.stroke();
      }

      ctx.restore();
    }

    /* ---------------- 方案二：祝福牆小卡邏輯 ---------------- */
    function submitBlessingCard() {
      const authorInput = document.getElementById('authorInput');
      const blessingInput = document.getElementById('blessingInput');
      const styleSelect = document.getElementById('cardStyleSelect');

      const author = authorInput.value.trim();
      const text = blessingInput.value.trim();
      const styleClass = styleSelect.value;

      if (!author || !text) {
        showToast('請填寫「簽名/姓名」與「祝福的話」喔！');
        return;
      }

      const cardData = {
        id: Date.now(),
        author: author,
        text: text,
        style: styleClass,
        date: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' })
      };

      store[currentTab].blessingCards.push(cardData);
      saveStorageState();
      renderBlessingCards();

      authorInput.value = '';
      blessingInput.value = '';

      showToast('🎉 已成功送出您的簽名與祝福小卡！');
    }

    function deleteBlessingCard(cardId) {
      store[currentTab].blessingCards = store[currentTab].blessingCards.filter(c => c.id !== cardId);
      saveStorageState();
      renderBlessingCards();
      showToast('已移除該筆祝福卡片');
    }

    function renderBlessingCards() {
      const grid = document.getElementById('blessingGrid');
      const badge = document.getElementById('wallCountBadge');
      const cards = store[currentTab].blessingCards;

      badge.innerText = `已收到 ${cards.length} 份祝福`;

      if (cards.length === 0) {
        grid.innerHTML = `
          <div class="blessing-empty-tip">
            🌸 目前尚無留言，歡迎在右側「打字快速簽名」留下給新人的第一份祝福！
          </div>
        `;
        return;
      }

      grid.innerHTML = cards.map(card => `
        <div class="blessing-card ${card.style}">
          <button class="card-delete-btn" title="刪除" onclick="deleteBlessingCard(${card.id})">✕</button>
          <div class="card-body-text">“${escapeHtml(card.text)}”</div>
          <div class="card-footer">
            <div class="card-author">✒️ ${escapeHtml(card.author)}</div>
            <div class="card-date">${card.date}</div>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    /* ---------------- 防護復原與清除機制 ---------------- */
    function undoMyStroke() {
      const strokes = store[currentTab].sessionStrokes;
      if (strokes.length > 0) {
        strokes.pop();
        redrawCurrentCanvas();
        showToast('已復原上一筆劃');
      } else {
        showToast('目前沒有可復原的筆劃');
      }
    }

    function clearMySessionStrokes() {
      if (store[currentTab].sessionStrokes.length > 0) {
        store[currentTab].sessionStrokes = [];
        redrawCurrentCanvas();
        showToast('已清除本次繪劃');
      } else {
        showToast('目前沒有新增筆劃');
      }
    }

    function commitSessionToPermanent() {
      if (store[currentTab].sessionStrokes.length > 0) {
        redrawCurrentCanvas();
        store[currentTab].permanentImage = canvas.toDataURL();
        store[currentTab].sessionStrokes = [];
      }
      saveStorageState();
    }

    /* ---------------- 管理者權限對話框 ---------------- */
    function openAdminModal() {
      document.getElementById('adminPassword').value = '';
      document.getElementById('adminModal').classList.add('active');
    }

    function closeAdminModal() {
      document.getElementById('adminModal').classList.remove('active');
    }

    function confirmAdminClear() {
      const pwd = document.getElementById('adminPassword').value;
      if (pwd === 'muchmore828') {
        store[currentTab].permanentImage = null;
        store[currentTab].sessionStrokes = [];
        store[currentTab].blessingCards = [];
        
        saveStorageState();
        redrawCurrentCanvas();
        renderBlessingCards();
        closeAdminModal();
        showToast(`已解鎖管理者權限！完全清空款式 ${currentTab === 1 ? 'A' : 'B'} 之全體歷史記錄與祝福牆`);
      } else {
        showToast('密碼錯誤！無法清空歷史記錄');
      }
    }

    function saveStorageState() {
      localStorage.setItem('wedding_cert_wall_v4', JSON.stringify({
        1: { permanentImage: store[1].permanentImage, blessingCards: store[1].blessingCards },
        2: { permanentImage: store[2].permanentImage, blessingCards: store[2].blessingCards }
      }));
    }

    function setColor(color, el) {
      strokeColor = color;
      document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
      el.classList.add('active');
    }

    function setBrushSize(size) {
      baseBrushSize = parseFloat(size);
      document.getElementById('brushSizeVal').innerText = parseFloat(size).toFixed(1) + ' px';
    }

    /* ---------------- 高解析度匯出 (含祝福牆) ---------------- */
    function exportImage() {
      showToast('正在準備高畫質結婚書約與祝福牆圖檔...');
      commitSessionToPermanent();
      
      document.querySelectorAll('.card-delete-btn').forEach(btn => btn.style.display = 'none');
      
      html2canvas(document.getElementById('certificateNode'), { 
        scale: 2.5, 
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#fcf8f2'
      }).then(c => {
        const link = document.createElement('a');
        link.download = `結婚書約_款式${currentTab === 1 ? 'A' : 'B'}_親友祝福牆.png`;
        link.href = c.toDataURL('image/png');
        link.click();
        
        document.querySelectorAll('.card-delete-btn').forEach(btn => btn.style.display = '');
        showToast('匯出成功！已下載完整結婚書約圖檔');
      }).catch(err => {
        console.error(err);
        document.querySelectorAll('.card-delete-btn').forEach(btn => btn.style.display = '');
        showToast('匯出時發生錯誤，請重繪後再試');
      });
    }

    window.addEventListener('load', init);
  </script>
